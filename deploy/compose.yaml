name: ownday

services:
  app:
    image: ${OWNDAY_IMAGE}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ownday

  migrate:
    image: ${OWNDAY_IMAGE}
    restart: "no"

    env_file:
      - .env

    entrypoint:
      - /app/efbundle

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ownday

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ownday

networks:
  ownday:
    driver: bridge

volumes:
  postgres_data:
