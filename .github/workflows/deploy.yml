name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ownday_test
          POSTGRES_USER: ownday_test
          POSTGRES_PASSWORD: ownday_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownday_test -d ownday_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests use unique Search Paths; disable idle pools accumulating per schema.
      # Pool-specific tests explicitly enable pooling with bounded pool sizes.
      OWNDAY_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=ownday_test;Username=ownday_test;Password=ownday_test;Pooling=false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build version
        id: version
        shell: bash
        env:
          LC_ALL: C
        run: |
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          event_commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          if [[ "$commit" != "$event_commit" ]]; then
            echo "The checkout does not match the workflow commit." >&2
            exit 1
          fi

          version=0.0.0-dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            number='(0|[1-9][0-9]*)'
            prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            metadata='[0-9A-Za-z-]+'
            semver="^v${number}\.${number}\.${number}(-${prerelease}(\.${prerelease})*)?(\+${metadata}(\.${metadata})*)?$"
            if ! [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
              echo "Expected a release tag in the form v<SemVer>." >&2
              exit 1
            fi

            tag_commit=$(git rev-parse --verify "${GITHUB_REF}^{commit}")
            if [[ "$tag_commit" != "$commit" ]]; then
              echo "The release tag does not point to the workflow commit." >&2
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          fi

          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet restore OwnDay.slnx "-p:Version=$BUILD_VERSION"

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REVISION_ID: ${{ steps.version.outputs.commit }}
        run: >
          dotnet build OwnDay.slnx
          --configuration Release
          --no-restore
          "-p:Version=$BUILD_VERSION"
          "-p:SourceRevisionId=$SOURCE_REVISION_ID"

      - name: Test
        env:
          OWNDAY_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          OWNDAY_EXPECTED_COMMIT_SHA: ${{ steps.version.outputs.commit }}
        run: >
          dotnet test OwnDay.slnx
          --configuration Release
          --no-build

  publish-image:
    name: Publish Docker image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          # Give build steps explicit DNS instead of inheriting the runner resolver.
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ needs.test.outputs.commit }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            OWNDAY_VERSION=${{ needs.test.outputs.version }}
            OWNDAY_SOURCE_REVISION_ID=${{ needs.test.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
            org.opencontainers.image.revision=${{ needs.test.outputs.commit }}

  deploy:
    name: Deploy
    needs: publish-image
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://telegram.ownday.life

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat >> ~/.ssh/config <<'EOF'
          Host production
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy exact image
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          ssh \
            -o "HostName=${VPS_HOST}" \
            -o "User=${VPS_USER}" \
            production \
            "cd '${DEPLOY_PATH}' && \
             sed -i 's|^OWNDAY_IMAGE=.*|OWNDAY_IMAGE=${IMAGE}@${IMAGE_DIGEST}|' .env && \
             docker compose -f compose.yaml pull app migrate postgres && \
             docker compose -f compose.yaml up -d postgres && \
             docker compose -f compose.yaml run --rm migrate && \
             docker compose -f compose.yaml up -d app --remove-orphans"

      - name: Verify deployment
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          for attempt in {1..12}; do
            if ssh \
              -o "HostName=${VPS_HOST}" \
              -o "User=${VPS_USER}" \
              production \
              "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"; then
              echo "Deployment is healthy."
              exit 0
            fi

            echo "Health check attempt ${attempt}/12 failed."
            sleep 5
          done

          echo "Deployment health check failed."

          ssh \
            -o "HostName=${VPS_HOST}" \
            -o "User=${VPS_USER}" \
            production \
            "cd '${DEPLOY_PATH}' && \
             docker compose -f compose.yaml ps && \
             docker compose -f compose.yaml logs --tail=100 migrate app"

          exit 1
